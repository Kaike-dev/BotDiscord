services:
  bot:
    build:
      context: .
    container_name: bot-discord-torneios
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_FILE: /app/data/tournaments.json
    volumes:
      - type: bind
        source: ./data
        target: /app/data
